services:
  - type: web
    name: ai-helmet-detector
    env: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: YOLO_CONFIG_DIR
        value: "/tmp"
