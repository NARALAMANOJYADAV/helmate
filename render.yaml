services:
  - type: web
    name: helmate
    env: docker
    plan: free
    region: singapore
    branch: main
    dockerFilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "5001"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
