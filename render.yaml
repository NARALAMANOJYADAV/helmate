services:
  - type: web
    name: helmate-server
    env: docker
    plan: free
    region: ohio
    branch: main
    dockerFilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: "5001"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
    disk:
      name: database-disk
      mountPath: /app/database
      sizeGB: 1
