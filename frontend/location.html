<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locations - Helmet AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="sync.js"></script>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>

<body>
    <div class="dashboard">
        <aside class="sidebar">
            <h2><i class="fas fa-shield-alt"></i> Helmet AI</h2>
            <ul>
                <li><a href="dash-home.html"><i class="fas fa-video"></i> Live Camera</a></li>
                <li><a href="dashboard.html"><i class="fas fa-exclamation-triangle"></i> Violations</a></li>
                <li><a href="graph.html"><i class="fas fa-chart-line"></i> Statistics</a></li>
                <li><a href="location.html" class="active"><i class="fas fa-map-marker-alt"></i> Locations</a></li>
                <li><a href="messages.html"><i class="fas fa-bell"></i> Alerts</a></li>
                <li><a href="logout"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <header>
                <h1>Camera Locations</h1>
                <button id="darkModeToggle">🌙</button>
            </header>

            <div class="stats">
                <div class="card">
                    <h3>Active Cameras</h3>
                    <p class="value">04</p>
                </div>
                <div class="card">
                    <h3>Offline</h3>
                    <p class="value">00</p>
                </div>
            </div>

            <section class="table-section">
                <table>
                    <thead>
                        <tr>
                            <th>Camera ID</th>
                            <th>Location</th>
                            <th>Address</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>CAM-001</td>
                            <td>Main Entrance</td>
                            <td>Gate 1, Campus Central</td>
                            <td><span class="status-badge status-paid">Online</span></td>
                            <td><button
                                    style="border:none; background:none; color:var(--accent-color); cursor:pointer;">Manage</button>
                            </td>
                        </tr>
                        <tr>
                            <td>CAM-002</td>
                            <td>North Exit</td>
                            <td>Sector 4, Near Parking</td>
                            <td><span class="status-badge status-paid">Online</span></td>
                            <td><button
                                    style="border:none; background:none; color:var(--accent-color); cursor:pointer;">Manage</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>
    <script>
        const btn = document.getElementById('darkModeToggle');
        btn.addEventListener('click', () => {
            document.body.toggleAttribute('data-theme');
            btn.innerText = document.body.hasAttribute('data-theme') ? '☀' : '🌙';
        });
    </script>
</body>

</html>
