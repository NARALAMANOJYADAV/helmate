<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerts - Helmet AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="sync.js"></script>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>

<body>
    <div class="dashboard">
        <aside class="sidebar">
            <h2><i class="fas fa-shield-alt"></i> Helmet AI</h2>
            <ul>
                <li><a href="dash-home.html"><i class="fas fa-video"></i> Live Camera</a></li>
                <li><a href="dashboard.html"><i class="fas fa-exclamation-triangle"></i> Violations</a></li>
                <li><a href="graph.html"><i class="fas fa-chart-line"></i> Statistics</a></li>
                <li><a href="location.html"><i class="fas fa-map-marker-alt"></i> Locations</a></li>
                <li><a href="messages.html" class="active"><i class="fas fa-bell"></i> Alerts</a></li>
                <li><a href="logout"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <header>
                <h1>System Alerts</h1>
                <button id="darkModeToggle">🌙</button>
            </header>

            <div class="table-section">
                <div class="card"
                    style="margin-bottom: 1rem; border-left: 4px solid #ef4444; background: rgba(239, 68, 68, 0.05);">
                    <h3 style="color: #ef4444;">High Violation Alert</h3>
                    <p style="margin-top: 5px;">Detected 10+ violations within the last hour at Main Entrance.</p>
                    <small style="color: var(--text-muted);">2 minutes ago</small>
                </div>
                <div class="card"
                    style="margin-bottom: 1rem; border-left: 4px solid #38bdf8; background: rgba(56, 189, 248, 0.05);">
                    <h3 style="color: #38bdf8;">System Update</h3>
                    <p style="margin-top: 5px;">YOLO model v2.1 successfully deployed to all cameras.</p>
                    <small style="color: var(--text-muted);">1 hour ago</small>
                </div>
            </div>
        </main>
    </div>
    <script>
        const btn = document.getElementById('darkModeToggle');
        btn.addEventListener('click', () => {
            document.body.toggleAttribute('data-theme');
            btn.innerText = document.body.hasAttribute('data-theme') ? '☀' : '🌙';
        });
    </script>
</body>

</html>
