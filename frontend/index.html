<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helmet AI - Smart Safety Detection</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="sync.js"></script>
    <style>
        .landing-hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            padding: 0 20px;
        }

        .landing-hero h1 {
            font-size: 4rem;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .landing-hero p {
            font-size: 1.2rem;
            color: var(--text-muted);
            max-width: 600px;
            margin-bottom: 2rem;
        }

        /* Port Warning Styling */
        #portWarning {
            display: none;
            position: fixed;
            top: 20px;
            background: #ef4444;
            color: white;
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            z-index: 9999;
            text-align: center;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="landing-hero">
        <h1>Smart Helmet AI</h1>
        <p>AI-Powered Real-Time Helmet Detection and Automatic Challan Generation System.</p>
        <a href="login.html" id="startBtn" class="card"
            style="text-decoration:none; padding: 15px 40px; border-radius: 30px; background: var(--accent-color); color: white; font-weight: 600;">Get
            Started</a>
    </div>

    <script>
        console.log("Welcome to Smart Helmet AI");
    </script>
</body>

</html>
